<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💗</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
background:
linear-gradient(135deg,#ffb6d5,#ffe6f0,#ffc4dc);
}

/* Glass Card */

.card{
width:88%;
max-width:390px;
padding:35px 24px;
text-align:center;
background:rgba(255,255,255,.82);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.8);
border-radius:30px;
box-shadow:
0 20px 60px rgba(150,40,90,.25);
animation:cardIn .8s ease;
z-index:10;
}

@keyframes cardIn{

from{
opacity:0;
transform:translateY(30px) scale(.9);
}

to{
opacity:1;
transform:translateY(0) scale(1);
}

}

/* Heart */

.heart{
font-size:70px;
animation:heartbeat 1.4s infinite;
}

@keyframes heartbeat{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.18);
}

}

h1{
color:#d83f70;
font-size:27px;
margin:18px 0;
}

.message{
color:#555;
font-size:17px;
line-height:2;
min-height:120px;
}

button{
border:none;
padding:15px 32px;
border-radius:50px;
background:linear-gradient(135deg,#ff4f83,#d93668);
color:white;
font-size:16px;
font-weight:bold;
box-shadow:0 8px 25px rgba(217,54,104,.3);
transition:.25s;
}

button:active{
transform:scale(.92);
}

.step{
margin-top:20px;
color:#aaa;
font-size:13px;
}

/* Floating hearts */

.float{
position:fixed;
bottom:-50px;
font-size:25px;
animation:floatUp linear infinite;
opacity:0;
z-index:1;
}

.h1{
left:8%;
animation-duration:7s;
}

.h2{
left:25%;
animation-duration:9s;
animation-delay:2s;
}

.h3{
left:48%;
animation-duration:8s;
animation-delay:1s;
}

.h4{
left:70%;
animation-duration:10s;
animation-delay:3s;
}

.h5{
left:88%;
animation-duration:7s;
animation-delay:4s;
}

@keyframes floatUp{

0%{
transform:translateY(0) rotate(0);
opacity:0;
}

15%{
opacity:1;
}

100%{
transform:translateY(-115vh) rotate(360deg);
opacity:0;
}

}

</style>
</head>

<body>

<div class="float h1">💗</div>
<div class="float h2">💕</div>
<div class="float h3">🌸</div>
<div class="float h4">💖</div>
<div class="float h5">💗</div>


<div class="card">

<div class="heart" id="heart">
💗
</div>

<h1 id="title">
အဆင့် ၁ 💗
</h1>

<div class="message" id="message">
ဒီစာမျက်နှာလေးက<br>
မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷
</div>

<button id="button" onclick="nextStep()">
💌 ဆက်ကြည့်မယ်
</button>

<div class="step" id="step">
1 / 5
</div>

</div>


<script>

let step=1;

function nextStep(){

step++;

if(step==2){

document.getElementById("heart").innerHTML="🌸";

document.getElementById("title").innerHTML=
"အဆင့် ၂ 🌸";

document.getElementById("message").innerHTML=
"မင်းကို ပြောချင်တဲ့<br>စာလေးတစ်ခုရှိတယ် 🤭";

}

else if(step==3){

document.getElementById("heart").innerHTML="💕";

document.getElementById("title").innerHTML=
"အဆင့် ၃ 💕";

document.getElementById("message").innerHTML=
"မင်းနဲ့ စကားပြောရတဲ့အချိန်တိုင်း<br>ပျော်မိတယ်။";

}

else if(step==4){

document.getElementById("heart").innerHTML="💖";

document.getElementById("title").innerHTML=
"အဆင့် ၄ 💖";

document.getElementById("message").innerHTML=
"တကယ်တော့…<br>မင်းကို သဘောကျနေမိပြီထင်တယ် 🙈";

}

else if(step==5){

document.getElementById("heart").innerHTML="🥹";

document.getElementById("title").innerHTML=
"အဆင့် ၅ 💗";

document.getElementById("message").innerHTML=
"ဒီစာလေးဖတ်ပြီး ပြုံးမိရင်<br>ငါလည်း ပျော်ပြီ 💗";

document.getElementById("button").innerHTML=
"💗 ပြီးပြီ";

}

document.getElementById("step").innerHTML=
step+" / 5";

}

</script>

</body>
</html>
