<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💗</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
background:linear-gradient(135deg,#ffb6d5,#ffe6f0,#ffc4dc);
}

.card{
width:88%;
max-width:390px;
padding:35px 24px;
text-align:center;
background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);
border-radius:30px;
box-shadow:0 20px 60px rgba(150,40,90,.25);
z-index:10;
animation:show .7s ease;
}

@keyframes show{
from{opacity:0;transform:scale(.85)}
to{opacity:1;transform:scale(1)}
}

.heart{
font-size:75px;
animation:beat 1.3s infinite;
}

@keyframes beat{
50%{transform:scale(1.2)}
}

h1{
color:#d83f70;
font-size:27px;
}

.message{
color:#555;
font-size:17px;
line-height:2;
min-height:120px;
}

button{
border:0;
padding:15px 32px;
border-radius:50px;
background:linear-gradient(135deg,#ff4f83,#d93668);
color:white;
font-size:16px;
font-weight:bold;
box-shadow:0 8px 25px rgba(217,54,104,.3);
}

button:active{
transform:scale(.92);
}

.step{
margin-top:20px;
color:#aaa;
font-size:13px;
}

.float{
position:fixed;
bottom:-50px;
font-size:25px;
animation:up 8s linear infinite;
opacity:0;
}

.a1{left:10%}
.a2{left:30%;animation-delay:2s}
.a3{left:55%;animation-delay:4s}
.a4{left:80%;animation-delay:1s}

@keyframes up{
0%{transform:translateY(0);opacity:0}
20%{opacity:1}
100%{transform:translateY(-115vh);opacity:0}
}

/* FINAL */

.final{
display:none;
animation:finalIn 1s ease;
}

@keyframes finalIn{
from{
opacity:0;
transform:scale(.5);
}
to{
opacity:1;
transform:scale(1);
}
}

.big{
font-size:90px;
animation:beat 1.2s infinite;
}

.final h1{
font-size:30px;
}

.final p{
font-size:18px;
line-height:2;
color:#555;
}

</style>
</head>

<body>

<div class="float a1">💗</div>
<div class="float a2">💕</div>
<div class="float a3">💖</div>
<div class="float a4">🌸</div>

<div class="card" id="card">

<div class="heart" id="heart">💗</div>

<h1 id="title">အဆင့် ၁ 💗</h1>

<div class="message" id="message">
ဒီစာမျက်နှာလေးက<br>
မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷
</div>

<button id="button" onclick="nextStep()">
💌 ဆက်ကြည့်မယ်
</button>

<div class="step" id="step">1 / 5</div>

</div>


<!-- FINAL SCREEN -->

<div class="card final" id="final">

<div class="big">💗</div>

<h1>မင်းအတွက်ပါ 🌷</h1>

<p>
ဒီစာလေးကို ဖတ်ပေးလို့<br>
ကျေးဇူးတင်ပါတယ်။ 🥹<br><br>

မင်းပြုံးမိခဲ့ရင်<br>
ဒီစာမျက်နှာလေးရဲ့ ရည်ရွယ်ချက် ပြည့်ပါပြီ။ 💕
</p>

<div style="font-size:35px">
💗 💕 💖 💕 💗
</div>

</div>


<script>

let step=1;

function nextStep(){

step++;

if(step==2){

heart.innerHTML="🌸";
title.innerHTML="အဆင့် ၂ 🌸";
message.innerHTML=
"မင်းကို ပြောချင်တဲ့<br>စာလေးတစ်ခုရှိတယ် 🤭";

}

else if(step==3){

heart.innerHTML="💕";
title.innerHTML="အဆင့် ၃ 💕";
message.innerHTML=
"မင်းနဲ့ စကားပြောရတဲ့အချိန်တိုင်း<br>ပျော်မိတယ်။";

}

else if(step==4){

heart.innerHTML="💖";
title.innerHTML="အဆင့် ၄ 💖";
message.innerHTML=
"တကယ်တော့…<br>မင်းကို သဘောကျနေမိပြီထင်တယ် 🙈";

}

else if(step==5){

heart.innerHTML="🥹";
title.innerHTML="အဆင့် ၅ 💗";
message.innerHTML=
"နောက်ဆုံးတစ်ခုလေးပဲ…<br>မင်းအတွက် သီးသန့်ရေးထားတာပါ 💗";

button.innerHTML="💌 ဖွင့်ကြည့်မယ်";

}

else{

document.getElementById("card").style.display="none";
document.getElementById("final").style.display="block";

}

document.getElementById("step").innerHTML=step+" / 5";

}
const final = document.createElement("div");

final.id = "final";

final.style.display = "none";
final.style.textAlign = "center";

final.innerHTML = `
<div style="font-size:90px;"></div>

<h1 style="color:#d83f70;">
မင်းအတွက်ပါ 
</h1>

<p style="font-size:18px;line-height:2;color:#555;">
ဒီစာလေးကို ဖတ်ပေးလို့ ကျေးဇူးတင်ပါတယ် <br><br>
မင်းပြုံးမိခဲ့ရင်<br>
ငါလည်း ပျော်ပြီ 
</p>

<div style="font-size:35px;">
    
</div>
`;

document.body.appendChild(final);
</script>

</body>
</html>
