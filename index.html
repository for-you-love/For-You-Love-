 <!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You Love 💗</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#ffd6e0,#ffeef3,#ffc4d6);
 overflow:hidden;
}

.card{
 width:90%;
 max-width:400px;
 padding:35px 25px;
 text-align:center;
 background:rgba(255,255,255,.82);
 border-radius:28px;
 box-shadow:0 15px 40px rgba(170,70,100,.25);
}

.big{
 font-size:65px;
 animation:pulse 1.5s infinite;
}

@keyframes pulse{
 50%{transform:scale(1.15)}
}

h1{
 color:#d94b78;
 margin:12px 0;
}

p{
 color:#555;
 line-height:1.8;
}

button{
 margin-top:15px;
 padding:13px 28px;
 border:0;
 border-radius:30px;
 background:#e65380;
 color:white;
 font-size:16px;
 font-weight:bold;
}

#message{
 display:none;
 margin-top:25px;
 color:#c63e68;
 line-height:2;
 font-size:17px;
}

.heart{
 position:fixed;
 bottom:-30px;
 font-size:25px;
 animation:up 6s linear infinite;
}

.h1{left:10%;animation-delay:0s}
.h2{left:30%;animation-delay:2s}
.h3{left:55%;animation-delay:4s}
.h4{left:80%;animation-delay:1s}

@keyframes up{
 0%{transform:translateY(0);opacity:0}
 20%{opacity:1}
 100%{transform:translateY(-110vh);opacity:0}
}
</style>
</head>

<body>

<div class="heart h1">💗</div>
<div class="heart h2">💕</div>
<div class="heart h3">💖</div>
<div class="heart h4">💞</div>

<div class="card">

<div class="big">💗</div>

<h1>For You Love</h1>

<p>
ဒီစာမျက်နှာလေးက<br>
မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷
</p>

<button onclick="showMessage()">
💌 နှိပ်ကြည့်ပါ
</button>

<div id="message">
မင်းနဲ့စကားပြောရတဲ့အချိန်တိုင်း<br>
ငါ့အတွက် ပျော်စရာလေးတစ်ခု ဖြစ်နေတယ်။ 💕<br><br>

တစ်ခုတော့ ပြောချင်တယ်…<br>
မင်းကို သဘောကျနေမိပြီထင်တယ် 🙈💗
</div>

</div>

<script>
function showMessage(){
 document.getElementById("message").style.display="block";
}
</script>

</body>
</html>
