<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💗</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6);
    font-family:Arial,sans-serif;
}

.card{
    width:85%;
    max-width:400px;
    background:white;
    padding:30px 20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px #d88;
}

.heart{
    font-size:60px;
}

h1{
    color:#d94b78;
}

.message{
    color:#555;
    font-size:17px;
    line-height:2;
    min-height:110px;
}

button{
    border:0;
    background:#e65380;
    color:white;
    padding:14px 30px;
    border-radius:30px;
    font-size:16px;
}

.step{
    margin-top:20px;
    color:#999;
}
</style>
</head>

<body>

<div class="card">

<div class="heart" id="heart">💗</div>

<h1 id="title">အဆင့် ၁ 💗</h1>

<div class="message" id="message">
ဒီစာမျက်နှာလေးက<br>
မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷
</div>

<button onclick="nextStep()" id="button">
💌 ဆက်ကြည့်မယ်
</button>

<div class="step" id="step">
1 / 5
</div>

</div>


<script>

let step = 1;

function nextStep(){

step++;

if(step == 2){

document.getElementById("heart").innerHTML="🌸";
document.getElementById("title").innerHTML="အဆင့် ၂ 🌸";
document.getElementById("message").innerHTML=
"မင်းကို ပြောချင်တဲ့<br>စာလေးတစ်ခုရှိတယ် 🤭";

}

else if(step == 3){

document.getElementById("heart").innerHTML="💕";
document.getElementById("title").innerHTML="အဆင့် ၃ 💕";
document.getElementById("message").innerHTML=
"မင်းနဲ့ စကားပြောရတဲ့အချိန်တိုင်း<br>ပျော်မိတယ်။";

}

else if(step == 4){

document.getElementById("heart").innerHTML="💖";
document.getElementById("title").innerHTML="အဆင့် ၄ 💖";
document.getElementById("message").innerHTML=
"တကယ်တော့…<br>မင်းကို သဘောကျနေမိပြီထင်တယ် 🙈";

}

else if(step == 5){

document.getElementById("heart").innerHTML="🥹";
document.getElementById("title").innerHTML="အဆင့် ၅ 💗";
document.getElementById("message").innerHTML=
"ဒီစာလေးဖတ်ပြီး ပြုံးမိရင်<br>ငါလည်း ပျော်ပြီ 💗";

document.getElementById("button").innerHTML="💗 ပြီးပြီ";

}

else{

document.getElementById("button").disabled=true;

}

document.getElementById("step").innerHTML=step+" / 5";

}

</script>

</body>
</html>
