 <!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For You 💗</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#ffd6e5,#fff0f5,#ffc2d6);
 overflow:hidden;
}

.card{
 width:90%;
 max-width:410px;
 padding:35px 25px;
 text-align:center;
 background:rgba(255,255,255,.9);
 border-radius:30px;
 box-shadow:0 15px 50px rgba(150,50,90,.25);
 z-index:2;
}

.heart{
 font-size:65px;
 animation:pulse 1.5s infinite;
}

@keyframes pulse{
 50%{transform:scale(1.15)}
}

h1{
 color:#d94b78;
 margin:15px 0;
}

.message{
 color:#555;
 font-size:17px;
 line-height:2;
 min-height:120px;
}

button{
 border:0;
 padding:14px 30px;
 margin-top:15px;
 border-radius:30px;
 background:#e65380;
 color:white;
 font-size:16px;
 font-weight:bold;
 box-shadow:0 7px 20px rgba(230,83,128,.3);
}

.step{
 color:#aaa;
 font-size:12px;
 margin-top:20px;
}

.float{
 position:fixed;
 bottom:-40px;
 font-size:25px;
 animation:float 7s linear infinite;
}

.f1{left:10%;animation-delay:0s}
.f2{left:30%;animation-delay:2s}
.f3{left:55%;animation-delay:4s}
.f4{left:80%;animation-delay:1s}

@keyframes float{
 0%{
  transform:translateY(0);
  opacity:0;
 }
 20%{opacity:1}
 100%{
  transform:translateY(-110vh);
  opacity:0;
 }
}
</style>
</head>

<body>

<div class="float f1">💗</div>
<div class="float f2">💕</div>
<div class="float f3">💖</div>
<div class="float f4">🌸</div>

<div class="card">

<div class="heart" id="heart">💗</div>

<h1 id="title">For You</h1>

<div class="message" id="message">
ဒီစာမျက်နှာလေးက<br>
မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷
</div>

<button id="next" onclick="nextStep()">
💌 ဆက်ကြည့်မယ်
</button>

<div class="step" id="step">1 / 5</div>

</div>

<script>

let current=1;

const data=[

{
title:"For You 💗",
heart:"💗",
text:"ဒီစာမျက်နှာလေးက<br>မင်းအတွက် သီးသန့်လုပ်ထားတာပါ 🌷"
},

{
title:"တစ်ခုရှိတယ်… 🌸",
heart:"🌸",
text:"ဒီစာလေးကို<br>ဘယ်သူ့ကိုမှ မပြဘဲ မင်းတစ်ယောက်တည်း ဖတ်နော် 🤭"
},

{
title:"ပြောချင်တာလေး… 💕",
heart:"💕",
text:"မင်းနဲ့ စကားပြောရတဲ့အချိန်တိုင်း<br>ငါ့အတွက် ပျော်စရာလေးတစ်ခု ဖြစ်နေတယ်။"
},

{
title:"တကယ်တော့… 🙈",
heart:"💖",
text:"မင်းကိုတွေ့ရင်<br>ဘာပြောရမလဲ မသိတော့ဘူး။<br>ဒါပေမယ့် မင်းနဲ့စကားပြောချင်နေမိတယ်။"
},

{
title:"နောက်ဆုံးတစ်ခု 💗",
heart:"🥹",
text:"မင်းကို သဘောကျနေမိပြီထင်တယ်။ 💗<br><br>ဒီစာလေးဖတ်ပြီး ပြုံးမိရင်<br>ငါလည်း ပျော်ပြီ။ 🌷"
}

];

function nextStep(){

if(current < 5){

 current++;

 document.getElementById("title").innerHTML=data[current-1].title;

 document.getElementById("heart").innerHTML=data[current-1].heart;

 document.getElementById("message").innerHTML=data[current-1].text;

 document.getElementById("step").innerHTML=current+" / 5";

}else{

 document.getElementById("next").innerHTML="💗 ပြီးပြီ";

 document.getElementById("next").disabled=true;

}

}

</script>

</body>
</html>
